services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lawfocus
      POSTGRES_PASSWORD: lawfocus_dev_password
      POSTGRES_DB: lawfocus_dev
    ports:
      - "5432:5432"
    volumes:
      - lawfocus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawfocus -d lawfocus_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      LAWFOCUS_DATABASE_URL: postgresql+psycopg://lawfocus:lawfocus_dev_password@db:5432/lawfocus_dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  lawfocus_pgdata:
